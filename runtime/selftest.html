<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Claude splash test fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:240px 1fr;grid-template-rows:36px 1fr;font:18px/1.6 sans-serif;color:#3c332b;background:#faf8f4;height:100vh}
aside{grid-column:1;grid-row:1/3;padding:32px;background:#efece6;border-right:1px solid #ddd5c9}
header{grid-column:2;grid-row:1;background:#faf8f4;padding:4px 24px;font-size:14px}
main{grid-column:2;grid-row:2;min-height:0;padding:40px 10%;display:flex;flex-direction:column;gap:32px;transform:translateZ(0);contain:paint}
section{padding:20px;border-radius:18px}section:first-child{background:#eee9e0;align-self:flex-end}
[contenteditable]{margin-top:auto;background:#fffdf8;padding:24px;border:1px solid #c6baaa;border-radius:18px}
button{align-self:flex-end;padding:10px 20px;border:1px solid #c6baaa;border-radius:10px;background:#fffdf8;font:inherit}
</style>
<body><aside>Native sidebar</aside><header class="dframe-content"><div class="dframe-content-inner">Native title bar</div></header><main>
<section data-cds="UserMessage">Synthetic user message</section>
<section data-cds="AssistantMessage">Synthetic assistant message</section>
<div contenteditable="true">Unsent synthetic draft</div>
<button type="button">Native action</button>
</main></body></html>
