name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media metadata reader
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Privacy and unit tests
        run: |
          python3 scripts/privacy_check.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Script syntax
        run: |
          for file in scripts/linux/*.sh scripts/prepare-media.sh; do bash -n "$file"; done
          find runtime -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PowerShell checks
        shell: pwsh
        run: ./tests/windows.ps1
